services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financebot_app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BAILEYS_AUTH_DIRECTORY: /app/data/baileys-auth
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - baileys_auth:/app/data/baileys-auth
      # Mount Google OAuth files from host so token refreshes persist
      - ./oauth_credentials.json:/app/oauth_credentials.json:ro
      - ./token.json:/app/token.json

  postgres:
    image: postgres:17-alpine
    container_name: financebot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bind to 127.0.0.1 so database isn't exposed to the public internet on VPS
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: financebot_redis
    restart: always
    ports:
      # Bind to 127.0.0.1 to secure Redis on VPS
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  baileys_auth:
  postgres_data: